<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="mfcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="mfcDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="mfcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="24" fill="url(#mfcDark)" stroke="#1E293B" stroke-width="2" />

  <!-- Stylized Urban Face Emblem (Left) -->
  <g transform="translate(60, 40)">
    <!-- Outer Face Mask Boundary Frame -->
    <rect x="0" y="0" width="160" height="160" rx="20" fill="#090D1A" stroke="url(#mfcGrad)" stroke-width="3" filter="url(#mfcGlow)" />

    <!-- Urban Street Network Silhouette Forming a Face -->
    <!-- Eyes (Road Junctions / Roundabouts) -->
    <circle cx="50" cy="55" r="14" fill="none" stroke="#00F0FF" stroke-width="3" />
    <circle cx="50" cy="55" r="6" fill="#00F0FF" />
    <circle cx="110" cy="55" r="14" fill="none" stroke="#00F0FF" stroke-width="3" />
    <circle cx="110" cy="55" r="6" fill="#00F0FF" />

    <!-- Nose / Bridge Highway -->
    <path d="M 80 45 L 80 85 L 68 95 L 92 95" fill="none" stroke="#FF0055" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mouth / Avenue Curve -->
    <path d="M 45 120 Q 80 140 115 120" fill="none" stroke="#7000FF" stroke-width="4" stroke-linecap="round" />

    <!-- Halftone Vector Stipple Nodes -->
    <circle cx="30" cy="30" r="3" fill="#00F0FF" opacity="0.6" />
    <circle cx="130" cy="30" r="3" fill="#00F0FF" opacity="0.6" />
    <circle cx="25" cy="80" r="4" fill="#7000FF" opacity="0.5" />
    <circle cx="135" cy="80" r="4" fill="#7000FF" opacity="0.5" />
    <circle cx="35" cy="135" r="2.5" fill="#FF0055" opacity="0.7" />
    <circle cx="125" cy="135" r="2.5" fill="#FF0055" opacity="0.7" />
  </g>

  <!-- Typography & Branding (Right) -->
  <g transform="translate(260, 85)">
    <!-- Package Title -->
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      MyFace<tspan fill="url(#mfcGrad)">2City</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8" letter-spacing="0.2">
      Turn Urban Street Networks &amp; Buildings into Optical Portrait Art
    </text>

    <!-- Badges / Tags -->
    <g transform="translate(0, 85)">
      <!-- Badge 1: 02Urban Portrait Engine -->
      <rect x="0" y="0" width="170" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="85" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00F0FF" text-anchor="middle">
        02Urban Portrait Engine
      </text>

      <!-- Badge 2: 10 Art Presets -->
      <rect x="180" y="0" width="115" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="237" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FF0055" text-anchor="middle">
        10 Art Presets
      </text>

      <!-- Badge 3: Halftone & SVG -->
      <rect x="305" y="0" width="145" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="377" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7000FF" text-anchor="middle">
        Halftone &amp; Vector SVG
      </text>
    </g>
  </g>
</svg>
